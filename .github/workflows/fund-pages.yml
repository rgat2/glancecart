# Publishes the static funding page (apps/fund) to GitHub Pages for free.
# Pages is enabled with Source: GitHub Actions (repo Settings → Pages).
# URL: https://rgat2.github.io/glancecart/  (TON Connect manifest is emitted alongside)
name: Fund page → GitHub Pages
on:
  push:
    branches: [main]
    paths: ['apps/fund/**', 'pnpm-lock.yaml', '.github/workflows/fund-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter "@glancecart/fund..."
      - run: pnpm --filter @glancecart/fund exec vite build
        env:
          FUND_PUBLIC_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/fund/dist
      - id: deployment
        uses: actions/deploy-pages@v5
